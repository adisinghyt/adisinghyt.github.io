<!DOCTYPE html>
<html>
<head>
<title>Dukaan Hisaab</title>
<style>
body{
    font-family: Arial;
    max-width: 700px;
    margin: auto;
    padding: 20px;
}
table{
    width:100%;
    border-collapse: collapse;
}
th,td{
    border:1px solid black;
    padding:8px;
    text-align:center;
}
input{
    width:80px;
}
button{
    padding:10px 20px;
    margin-top:20px;
}
</style>
</head>
<body>

<h2>Dukaan Hisaab Calculator</h2>

<table>
<tr>
<th>Product</th>
<th>Price</th>
<th>Pichhla Maal</th>
<th>Naya Maal</th>
<th>Bika</th>
<th>Bacha</th>
</tr>

<tr>
<td>Agarbatti</td>
<td>10</td>
<td><input type="number" id="p1"></td>
<td><input type="number" id="n1"></td>
<td><input type="number" id="s1"></td>
<td id="r1">0</td>
</tr>

<tr>
<td>Gulabjal</td>
<td>40</td>
<td><input type="number" id="p2"></td>
<td><input type="number" id="n2"></td>
<td><input type="number" id="s2"></td>
<td id="r2">0</td>
</tr>

<tr>
<td>Dashang</td>
<td>10</td>
<td><input type="number" id="p3"></td>
<td><input type="number" id="n3"></td>
<td><input type="number" id="s3"></td>
<td id="r3">0</td>
</tr>

<tr>
<td>Kishmish</td>
<td>10</td>
<td><input type="number" id="p4"></td>
<td><input type="number" id="n4"></td>
<td><input type="number" id="s4"></td>
<td id="r4">0</td>
</tr>

<tr>
<td>Celandar</td>
<td>10</td>
<td><input type="number" id="p5"></td>
<td><input type="number" id="n5"></td>
<td><input type="number" id="s5"></td>
<td id="r5">0</td>
</tr>

</table>

<br>

<label>Extra Kharch (₹): </label>
<input type="number" id="expense" value="0">

<br><br>

<button onclick="calculate()">Calculate</button>

<h3 id="sales"></h3>
<h3 id="profit"></h3>

<script>
function calculate(){

let prices=[10,40,10,10,10];
let totalSales=0;

for(let i=1;i<=5;i++){

let p=Number(document.getElementById("p"+i).value)||0;
let n=Number(document.getElementById("n"+i).value)||0;
let s=Number(document.getElementById("s"+i).value)||0;

let remain=p+n-s;

document.getElementById("r"+i).innerText=remain;

totalSales += s*prices[i-1];
}

let expense=Number(document.getElementById("expense").value)||0;

let finalProfit=totalSales-expense;

document.getElementById("sales").innerText=
"Total Bikri = ₹"+totalSales;

document.getElementById("profit").innerText=
"Kharch Katne Ke Baad = ₹"+finalProfit;
}
</script>

</body>
</html>
