<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dukaan Hisaab Calculator</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: auto;
    padding: 15px;
}

h2{
    text-align:center;
}

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px;
}

th,td{
    border:1px solid black;
    padding:8px;
    text-align:center;
}

input{
    width:70px;
    padding:5px;
}

button{
    padding:10px 20px;
    margin-top:20px;
    cursor:pointer;
}

.result{
    font-size:20px;
    font-weight:bold;
    margin-top:15px;
}
</style>
</head>

<body>

<h2>Dukaan Hisaab Calculator</h2>

<div class="table-container">
<table>

<tr>
<th>Product</th>
<th>Price (₹)</th>
<th>Pichhla Maal</th>
<th>Naya Maal</th>
<th>Bika</th>
<th>Bacha</th>
</tr>

<tr>
<td>Agarbatti</td>
<td>10</td>
<td><input type="number" id="p1"></td>
<td><input type="number" id="n1"></td>
<td id="s1">0</td>
<td><input type="number" id="r1"></td>
</tr>

<tr>
<td>Gulabjal</td>
<td>40</td>
<td><input type="number" id="p2"></td>
<td><input type="number" id="n2"></td>
<td id="s2">0</td>
<td><input type="number" id="r2"></td>
</tr>

<tr>
<td>Dashang</td>
<td>10</td>
<td><input type="number" id="p3"></td>
<td><input type="number" id="n3"></td>
<td id="s3">0</td>
<td><input type="number" id="r3"></td>
</tr>

<tr>
<td>Kishmish</td>
<td>10</td>
<td><input type="number" id="p4"></td>
<td><input type="number" id="n4"></td>
<td id="s4">0</td>
<td><input type="number" id="r4"></td>
</tr>

<tr>
<td>Celandar</td>
<td>10</td>
<td><input type="number" id="p5"></td>
<td><input type="number" id="n5"></td>
<td id="s5">0</td>
<td><input type="number" id="r5"></td>
</tr>

<tr>
<td>Mala</td>
<td>30</td>
<td><input type="number" id="p6"></td>
<td><input type="number" id="n6"></td>
<td id="s6">0</td>
<td><input type="number" id="r6"></td>
</tr>

</table>
</div>

<br>

<label><b>Extra Kharch (₹): </b></label>
<input type="number" id="expense" value="0">

<br><br>
<button onclick="calculate()">Calculate</button>
<button onclick="downloadReceipt()">Download Receipt</button>

<div class="result" id="sales"></div>
<div class="result" id="profit"></div>

<script>

function calculate(){

let prices=[10,40,10,10,10,30];
let totalSales=0;

for(let i=1;i<=6;i++){

let p=Number(document.getElementById("p"+i).value)||0;
let n=Number(document.getElementById("n"+i).value)||0;
let bacha=Number(document.getElementById("r"+i).value)||0;

let bika=(p+n)-bacha;

if(bika<0){
    bika=0;
}

document.getElementById("s"+i).innerText=bika;

totalSales += bika*prices[i-1];
}

let expense=Number(document.getElementById("expense").value)||0;

let finalAmount=totalSales-expense;

document.getElementById("sales").innerHTML=
"💰 Total Bikri = ₹" + totalSales;

document.getElementById("profit").innerHTML=
"📊 Kharch Katne Ke Baad = ₹" + finalAmount;
function downloadReceipt(){

let receipt = "Dukaan Hisaab Receipt\n";
receipt += "Date: " + new Date().toLocaleDateString() + "\n\n";

let products = [
["Agarbatti",10],
["Gulabjal",40],
["Dashang",10],
["Kishmish",10],
["Celandar",10],
["Mala",30]
];

let totalSales = 0;

for(let i=1;i<=6;i++){

let p=Number(document.getElementById("p"+i).value)||0;
let n=Number(document.getElementById("n"+i).value)||0;
let bacha=Number(document.getElementById("r"+i).value)||0;

let bika=(p+n)-bacha;
if(bika<0) bika=0;

let amount=bika*products[i-1][1];
totalSales += amount;

receipt += products[i-1][0] + " : " +
bika + " x ₹" +
products[i-1][1] +
" = ₹" + amount + "\n";
}

let expense=Number(document.getElementById("expense").value)||0;
let finalAmount=totalSales-expense;

receipt += "\n-----------------\n";
receipt += "Total Bikri : ₹" + totalSales + "\n";
receipt += "Extra Kharch : ₹" + expense + "\n";
receipt += "Final Amount : ₹" + finalAmount;

let blob = new Blob([receipt], {type:"text/plain"});
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "Receipt.txt";
a.click();
}
}

</script>

</body>
</html>
